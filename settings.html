<div class="tokenslim-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>🔧 TokenSlim — 聊天记录压缩</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- 说明 -->
            <div class="tokenslim-info">
                只压缩聊天记录，角色卡和世界书保持原样。
                <i class="fa-solid fa-circle-question tokenslim-help"
                   title="TokenSlim 只压缩聊天记录来省token。角色卡和世界书不压缩，保持原样放在prompt前面，这样它们作为稳定前缀可以命中API缓存（缓存命中时token计费更便宜）。压缩后的聊天摘要会注入到世界书之后的位置。"></i>
            </div>

            <!-- 启用 -->
            <div class="tokenslim-block flex-container">
                <input id="tokenslim_enabled" type="checkbox" />
                <label for="tokenslim_enabled">启用 TokenSlim</label>
            </div>

            <!-- 压缩策略 -->
            <div class="tokenslim-block">
                <div class="flex-container">
                    <label for="tokenslim_format">压缩策略</label>
                    <i class="fa-solid fa-circle-question tokenslim-help"
                       title="选择聊天记录的压缩策略，不同策略来自不同学科，适合不同类型的对话。&#10;&#10;🔧 结构化：省token最多，适合属性/行为/规则类内容&#10;📖 叙事：保留故事性，适合有剧情推进的对话&#10;🧠 深度：保留内在逻辑，适合角色有成长轨迹的对话&#10;🔗 关系：保留关系结构，适合多角色/复杂设定的对话&#10;&#10;不确定选什么 → 渐进摘要（默认推荐）"></i>
                </div>
                <select id="tokenslim_format">
                    <optgroup label="🔧 结构化 — 省token最多">
                        <option value="compact_list">精简列表</option>
                        <option value="plist">PList/SBF</option>
                        <option value="eav">EAV 实体属性值</option>
                        <option value="reaction_rule">反应规则</option>
                        <option value="keyword_cloud">关键词云</option>
                    </optgroup>
                    <optgroup label="📖 叙事 — 保留故事性">
                        <option value="timeline">时间线</option>
                        <option value="narrative_fold">叙事折叠</option>
                        <option value="story_summary">故事摘要</option>
                        <option value="dialogue_to_desc">对话→描述</option>
                    </optgroup>
                    <optgroup label="🧠 深度 — 保留内在逻辑">
                        <option value="archetype">原型锚点</option>
                        <option value="arc">角色弧光</option>
                        <option value="emotion_stack">情感栈</option>
                        <option value="schema">行为模式</option>
                    </optgroup>
                    <optgroup label="🔗 关系 — 保留关系结构">
                        <option value="relationship">关系图谱</option>
                        <option value="cornell">Cornell 笔记</option>
                        <option value="wpp">W++/JSON</option>
                        <option value="progressive">渐进摘要（推荐）</option>
                    </optgroup>
                </select>
                <div id="tokenslim_format_desc" class="tokenslim-format-desc"></div>
                <div id="tokenslim_format_example" class="tokenslim-example"></div>
            </div>

            <!-- Token 目标 -->
            <div class="tokenslim-block">
                <div class="flex-container">
                    <label for="tokenslim_token_target">目标 token 数</label>
                    <i class="fa-solid fa-circle-question tokenslim-help"
                       title="压缩后的大致token数量。&#10;&#10;• 150-200：极简，只保留最关键信息&#10;• 300：平衡模式（推荐），保留大部分关键信息&#10;• 500：详细，接近完整但去冗余&#10;&#10;例：20条聊天约2000 tok → 压缩到300 tok = 节省85%&#10;&#10;注意：≥1024 tok更有利于API缓存命中"></i>
                </div>
                <input id="tokenslim_token_target" type="number" min="50" max="2000" value="300" />
            </div>

            <!-- 质量自检 -->
            <div class="tokenslim-block flex-container">
                <input id="tokenslim_feynman" type="checkbox" checked />
                <label for="tokenslim_feynman">质量自检</label>
                <i class="fa-solid fa-circle-question tokenslim-help"
                   title="生成后让AI检查压缩结果是否遗漏了关键信息（基于Feynman学习法）。&#10;&#10;作用：防止压缩过度导致重要信息丢失&#10;&#10;例：聊天中角色承诺'明天老地方见面'，但压缩后漏掉了这条约定→自检会发现并补上&#10;&#10;会额外消耗一次AI调用"></i>
            </div>

            <!-- 自动注入 -->
            <div class="tokenslim-block flex-container">
                <input id="tokenslim_auto_inject" type="checkbox" checked />
                <label for="tokenslim_auto_inject">自动注入</label>
                <i class="fa-solid fa-circle-question tokenslim-help"
                   title="自动将压缩后的聊天摘要注入到prompt中。&#10;&#10;注入位置：世界书之后（IN_CHAT区域，depth=9999）&#10;&#10;这样prompt结构是：[系统提示][角色卡][世界书][FCC压缩摘要][聊天记录]&#10;&#10;角色卡+世界书作为稳定前缀→API缓存命中→token计费打折"></i>
            </div>

            <hr class="sysHR" />

            <!-- 操作 -->
            <div class="tokenslim-block">
                <div id="tokenslim_status" class="tokenslim-status">
                    <span class="tokenslim-status-inactive">⬜ FCC 未生成</span>
                </div>
                <div class="flex-container flexGap5">
                    <input id="tokenslim_generate_btn" class="menu_button" type="submit" value="⚡ 生成 FCC" />
                    <input id="tokenslim_rebuild_btn" class="menu_button" type="submit" value="🔄 重建" style="display:none" />
                    <input id="tokenslim_clear_btn" class="menu_button" type="submit" value="🗑 清除" style="display:none" />
                </div>
            </div>

            <div id="tokenslim_compress_result" class="tokenslim-block" style="display:none"></div>

            <!-- FCC 内容展示 -->
            <div id="tokenslim_fcc_panel" class="tokenslim-fcc-panel" style="display:none">
                <div class="tokenslim-fcc-header">
                    <span id="tokenslim_fcc_meta" class="tokenslim-meta"></span>
                    <div class="flex-container flexGap5">
                        <input id="tokenslim_copy_btn" class="menu_button" type="submit" value="📋 复制" title="复制 FCC 内容到剪贴板" />
                    </div>
                </div>
                <div id="tokenslim_fcc_content" class="tokenslim-fcc-content"></div>
            </div>

            <textarea id="tokenslim_fcc_raw" class="text_pole tokenslim-textarea" rows="6" style="display:none"></textarea>

            <hr class="sysHR" />

            <!-- 补丁 -->
            <div class="tokenslim-block">
                <div class="flex-container">
                    <b>📝 增量补丁</b>
                    <i class="fa-solid fa-circle-question tokenslim-help"
                       title="手动追加增量信息到FCC，不需要重新生成整个压缩。&#10;&#10;作用：对话中发生了重要变化时手动追加，保持FCC主体不变→缓存继续命中&#10;&#10;例：对话中角色说'我们现在是恋人了'→添加补丁：'关系更新：从朋友变为恋人'&#10;&#10;补丁追加到FCC末尾。补丁多了可以'折叠补丁'合并回主体。"></i>
                </div>
                <div class="flex-container flexGap5">
                    <input id="tokenslim_patch_input" class="text_pole" type="text" placeholder="例：关系更新为恋人" />
                    <input id="tokenslim_add_patch_btn" class="menu_button" type="submit" value="+ 添加" />
                </div>
                <pre id="tokenslim_patches_list" class="tokenslim-patches" style="display:none"></pre>
                <input id="tokenslim_fold_patches_btn" class="menu_button" type="submit" value="📦 折叠补丁" style="display:none" />
            </div>

            <hr class="sysHR" />

            <!-- 缓存 -->
            <div class="tokenslim-block">
                <div class="flex-container">
                    <b>💾 缓存健康度</b>
                    <i class="fa-solid fa-circle-question tokenslim-help"
                       title="检测当前配置是否有利于API缓存命中。&#10;&#10;为什么重要：缓存命中时，相同前缀的token计费更便宜（OpenAI 5折、Anthropic 9折）&#10;&#10;缓存命中的条件：prompt的前缀（开头部分）和之前请求相同&#10;&#10;所以角色卡+世界书+FCC保持不变→每次对话前缀相同→缓存命中→省钱&#10;&#10;影响缓存的因素：FCC前缀长度（≥1024 tok更好）、时间戳变量、深度注入条目等"></i>
                </div>
                <input id="tokenslim_cache_check_btn" class="menu_button" type="submit" value="🔍 检测" />
                <div id="tokenslim_cache_result"></div>
            </div>

        </div>
    </div>
</div>
